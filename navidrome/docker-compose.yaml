services:
  navidrome:
    image: deluan/navidrome:0.63.2
    user: 1000:1000 # should be owner of volumes
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      # ND_LOGLEVEL: debug
      ND_MUSICFOLDER: "/music/mish-music/Artists"
      ND_ENABLESHARING: "true"
    volumes:
      - "/data/navidrome/data:/data"
      - "./navidrome.toml:/navidrome.toml"
      - "/mnt/music:/music/mish-music:ro"
      - "/data/slskid/app/downloads/:/mnt/slskid-downloads:ro"
