services:
  beszel:
    container_name: beszel
    image: henrygd/beszel
    user: 1000:1000
    restart: unless-stopped
    environment:
      APP_URL: http://tau.slevel.xyz:8090
    ports:
      - 8090:8090
    volumes:
      - /data/beszel/data:/beszel_data
      - /var/run/beszel_socket:/beszel_socket
    healthcheck:
      test: ['CMD', '/beszel', 'health', '--url', 'http://localhost:8090']
      interval: 120s
      start_period: 10s
      timeout: 5s
      
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /data/beszel-agent/data:/var/lib/beszel-agent
      - /var/run/beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://tau.slevel.xyz:8090
    env_file:
      - secrets.env
    healthcheck:
      test: ['CMD', '/agent', 'health']
      interval: 120s
      start_period: 1s
